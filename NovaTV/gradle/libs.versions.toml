# Version choices are deliberate:
# - Media3 1.8.0 is the newest Media3 line whose minSdk is still 21 (1.9+ requires 23).
# - All AndroidX libraries below have minSdk <= 21, so the app runs on Android 5.0+
#   and comfortably on the primary target Android TV 7.1.1 (API 25).
# - AGP 8.13 + Gradle 8.14.3 + Kotlin 2.2 is a stable, mutually supported toolchain (JDK 17).
[versions]
agp = "8.13.2"
kotlin = "2.2.21"
media3 = "1.8.0"
okhttp = "4.12.0"
coroutines = "1.10.2"
coreKtx = "1.16.0"
activity = "1.10.1"
lifecycle = "2.9.4"
recyclerview = "1.4.0"
junit = "4.13.2"
qrcodegen = "1.8.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-rtsp = { module = "androidx.media3:media3-exoplayer-rtsp", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
qrcodegen = { module = "io.nayuki:qrcodegen", version.ref = "qrcodegen" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
